name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt
          python -m pip install pyinstaller

      - name: Build LeetMentorServer.exe
        run: python -m PyInstaller --noconfirm --clean --onefile --name LeetMentorServer --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan.on --hidden-import python_multipart --hidden-import pypdf --hidden-import openpyxl --paths . scripts/launcher.py

      - name: Assemble portable package
        run: |
          New-Item -ItemType Directory -Force -Path dist/LeetMentor-portable | Out-Null
          Copy-Item "dist/LeetMentorServer.exe" "dist/LeetMentor-portable/"
          Copy-Item "userscript/leetcode-mentor.user.js" "dist/LeetMentor-portable/"
          Copy-Item "docs/使用说明.txt" "dist/LeetMentor-portable/"
          Compress-Archive -Path "dist/LeetMentor-portable/*" -DestinationPath "dist/LeetMentor-${{ github.ref_name }}-win64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeetMentor-win64
          path: dist/LeetMentor-*-win64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LeetMentor-*-win64.zip
          generate_release_notes: true
